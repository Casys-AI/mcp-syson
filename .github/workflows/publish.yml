name: Publish

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build UI viewers
        run: |
          cd src/ui
          npm ci
          node build-all.mjs

      - name: Verify UI bundles
        run: deno task ui:verify

      - name: Install z3 (syson_constraint_solve backend)
        run: sudo apt-get update && sudo apt-get install -y z3

      - name: Type check
        run: deno check mod.ts server.ts

      - name: Run tests
        run: deno test --allow-all tests/

  publish-jsr:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build UI viewers
        run: |
          cd src/ui
          npm ci
          node build-all.mjs

      - name: Verify UI bundles
        run: deno task ui:verify

      - name: Verify JSR package contents
        run: npx jsr publish --dry-run --allow-dirty

      - name: Publish to JSR
        run: npx jsr publish --allow-dirty
